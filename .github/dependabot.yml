version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    # Disable Dependabot version-update PRs for npm while retaining dependency metadata.
    open-pull-requests-limit: 0
    groups:
      npm-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    # Disable Dependabot version-update PRs for GitHub Actions while retaining dependency metadata.
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - '*'
